  <circle cx="76" cy="52" r="5" fill="#1E232A"/>
  <circle cx="54" cy="50" r="1.5" fill="#FFFFFF"/>
  <circle cx="78" cy="50" r="1.5" fill="#FFFFFF"/>
  <!-- Beak -->
  <polygon points="64,57 57,66 71,66" fill="#FFAA00"/>
  <!-- Flippers -->
  <ellipse cx="32" cy="76" rx="6" ry="16" fill="#1E232A" transform="rotate(15 32 76)"/>
  <ellipse cx="96" cy="76" rx="6" ry="16" fill="#1E232A" transform="rotate(-15 96 76)"/>
  <!-- Feet -->
  <ellipse cx="50" cy="108" rx="10" ry="5" fill="#FFAA00"/>
  <ellipse cx="78" cy="108" rx="10" ry="5" fill="#FFAA00"/>
</svg>
