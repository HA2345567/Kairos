<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="penguBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#70D6FF" />
      <stop offset="100%" stop-color="#00A6FB" />
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="64" fill="url(#penguBg)"/>
  <!-- Penguin silhouette body -->
  <ellipse cx="64" cy="74" rx="32" ry="36" fill="#1E232A"/>
  <!-- White belly -->
  <ellipse cx="64" cy="78" rx="20" ry="26" fill="#FFFFFF"/>
  <!-- Eyes -->
